apply plugin: 'java-library'
apply plugin: 'java-gradle-plugin'
apply plugin: 'com.palantir.external-publish-jar'
apply plugin: 'com.palantir.gradle-plugin-testing'

gradlePlugin {
    plugins {
        wrapperPatcher {
            id = 'com.palantir.gradlew-patcher'
            implementationClass = 'com.palantir.gradle.utils.gradlewpatcher.WrapperPatcherPlugin'
        }
    }
}

dependencies {
    annotationProcessor 'org.immutables:value'
    implementation gradleApi()
    compileOnly 'org.immutables:value::annotations'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
}

tasks.named('test', Test) {
    def classpath = sourceSets.main.runtimeClasspath
    inputs.files(classpath)
    doFirst {
        systemProperty 'classpath', classpath.asPath
    }
}
