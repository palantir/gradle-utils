buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.palantir.gradle.jdks:gradle-jdks-settings:0.79.0'
    }
}
apply plugin: 'com.palantir.jdks.settings'
rootProject.name = 'gradle-utils'

include 'dependency-graph-utils'
include 'environment-variables'
include 'gutil'
include 'lazily-configured-mapping'
include 'circleci-artifacts'
include 'develocity-adapter-utils'
include 'platform'
include 'exec'
include 'providers'
include 'safe-exec-commandline'

throw new RuntimeException('''The excavator failed to run properly:\n\n''' + file('gradle/exception').text)
