buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.palantir.gradle.jdks:gradle-jdks-settings:0.82.0'
    }
}
apply plugin: 'com.palantir.jdks.settings'
rootProject.name = 'gradle-utils'

include 'dependency-graph-utils'
include 'environment-variables'
include 'gutil'
include 'lazily-configured-mapping'
include 'circleci-artifacts'
include 'develocity-adapter-utils'
include 'platform'
include 'exec'
include 'providers'
include 'safe-exec-commandline'
include 'project-dependency-utils'
throw new RuntimeException('''The excavator failed to run properly - exited with code 1 and output:\n\n''' + file('gradle/exception').text + '\n\n')
