apply plugin: 'java-library'
apply plugin: 'com.palantir.external-publish-jar'

dependencies {
    implementation gradleApi()

    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation project(':exec')

    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

// Note: GradleOperatingSystemTest requires 'java.base/java.lang' opens as a JVM argument
// because Gradle test fixtures (ObjectFactory) use reflective access to java.lang internals
// when creating synthetic test classes.
moduleJvmArgs {
    opens 'java.base/java.lang'
}

// Needs to be kept at Java 11 to keep compatibility with https://github.com/palantir/gradle-jdks/commit/6f0392f7ad8bbf6e2106531ce3e7b72814e292d9#diff-74e7049ae20f3b2702c8fdf3ac93ecddd1af9eac4b5876fcec1d082ae3a800b5R47-R48
javaVersion {
    target = 11
}